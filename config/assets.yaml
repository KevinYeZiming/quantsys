# Asset universe & evaluation configuration
# 资产池与统一买卖评估配置（股票 / 基金 / 黄金）

funds:
  # 场外基金自选池（akshare 基金代码，6位）
  watchlist:
    - "017103"   # 示例：大摩数字经济混合C（请替换为自己的基金）
    - "110022"   # 示例：易方达消费行业股票
  # 更新时是否同时抓累计净值与基金概况
  with_accumulated_nav: true
  with_info: true

gold:
  # 上金所现货标的
  spot_symbols:
    - "Au99.99"
    - "Au99.95"
  # 黄金ETF标的（场内代码）
  etf_codes:
    - "518880"   # 华安黄金ETF
    - "159934"   # 易方达黄金ETF

asset_evaluation:
  # 四维打分权重（须合计为 1.0）
  score_weights:
    momentum: 0.30   # 60日动量，历史分位
    trend: 0.30      # MA20/MA60 偏离，历史分位
    risk: 0.20       # 波动率 + 回撤，越高越安全
    position: 0.20   # 52周区间位置，越低越便宜（逆向）
  # 动作阈值（总分 0-100）
  thresholds:
    strong_buy: 75
    buy: 60
    sell: 40
    strong_sell: 25

factor_evaluation:
  # 因子有效性评估参数（scripts/evaluate_factors.py）
  horizons: [1, 3, 5, 10, 20]   # IC 衰减的前瞻窗口（交易日）
  n_quantiles: 10               # 分层回测组数
  min_cross_section: 30         # 每日最小横截面样本数
  primary_horizon: 5            # 主评估 horizon（分层/换手/报告）
