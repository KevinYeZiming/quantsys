[project]
name = "quantsys"
version = "0.1.0"
description = "中国A股量化交易系统 - Chinese A-Share Quantitative Trading System"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "backtrader>=1.9.78",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
